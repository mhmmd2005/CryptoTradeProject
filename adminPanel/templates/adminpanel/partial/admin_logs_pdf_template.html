<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            font-family: sans-serif;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
            font-size: 10px;
        }

        th {
            background-color: #f2f2f2;
        }

        h2 {
            text-align: center;
        }
    </style>
</head>
<body>
<h2>Admin Activity Report</h2>
<p>Generated on: {{ date }}</p>
<table>
    <thead>
    <tr>
        <th>Admin</th>
        <th>Action</th>
        <th>Details</th>
        <th>IP</th>
        <th>Date</th>
    </tr>
    </thead>
    <tbody>
    {% for log in logs %}
        <tr>
            <td>{{ log.admin.username }}</td>
            <td>{{ log.get_action_display }}</td>
            <td>{{ log.description }}</td>
            <td>{{ log.ip_address }}</td>
            <td>{{ log.created_at }}</td>
        </tr>
    {% endfor %}
    </tbody>
</table>
</body>
</html>
