<div class="table-responsive">
    <table class="table align-middle table-nowrap mb-0">
        <thead class="table-light">
        <tr>
            <th scope="col" class="ps-4">Admin Details</th>
            <th scope="col">Username</th>
            <th scope="col" class="text-center">Actions</th>
        </tr>
        </thead>
        <tbody>
        {% for admin in pending_admins %}
            <tr id="admin-row-{{ admin.id }}">
                <td>{{ admin.full_name }}</td>
                <td>@{{ admin.username }}</td>
                <td class="text-center">
                    <div class="d-flex gap-2 justify-content-center">
                        <button class="btn btn-sm btn-success"
                                hx-post="{% url 'admin-request-action' admin.id %}"
                                hx-vals='{"action": "approve"}'
                                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                                hx-target="#admin-row-{{ admin.id }}"
                                hx-swap="delete"
                                hx-confirm="Are you sure you want to approve this admin?">
                            <i class="ri-check-line"></i>
                        </button>

                        <button class="btn btn-sm btn-soft-danger"
                                hx-post="{% url 'admin-request-action' admin.id %}"
                                hx-vals='{"action": "reject"}'
                                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                                hx-target="#admin-row-{{ admin.id }}"
                                hx-swap="delete"
                                hx-confirm="Are you sure you want to reject this request?">
                            <i class="ri-close-line"></i>
                        </button>
                    </div>
                </td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="3" class="text-center py-4">No requests found.</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
