{% load static %}
<style>
    /* اگر کاربر جای دیگری از صفحه را هم کلیک کرد منو بسته شود */
    @media (max-width: 991.98px) {
        .vertical-sidebar-enable .custom-sidebar-overlay {
            display: block !important;
        }
    }
</style>

<header id="page-topbar">
    <div class="layout-width">
        <div class="navbar-header">

            <!-- سمت چپ: لوگو، همبرگر و فرم سرچ -->
            <div class="d-flex align-items-center">
                <!-- LOGO -->
                <div class="navbar-brand-box horizontal-logo">
                    <a href="index.html" class="logo logo-dark">
                        <span class="logo-sm">
                            <img src="{% static 'assets/images/logo-sm.png' %}" alt="" height="22">
                        </span>
                        <span class="logo-lg">
                            <img src="{% static 'assets/images/logo-dark.png' %}" alt="" height="17">
                        </span>
                    </a>

                    <a href="index.html" class="logo logo-light">
                        <span class="logo-sm">
                            <img src="{% static 'assets/images/logo-sm.png' %}" alt="" height="22">
                        </span>
                        <span class="logo-lg">
                            <img src="{% static 'assets/images/logo-light.png' %}" alt="" height="17">
                        </span>
                    </a>
                </div>

                <button type="button" class="btn btn-sm px-3 fs-16 header-item vertical-menu-btn topnav-hamburger"
                        id="topnav-hamburger-icon">
                    <span class="hamburger-icon">
                        <span></span>
                        <span></span>
                        <span></span>
                    </span>
                </button>

                <!-- Search Form -->
                <form class="app-search d-none d-md-block ms-2" action="{% url 'user-management' %}" method="GET">
                    <div class="position-relative">
                        <input type="text" name="q" class="form-control"
                               placeholder="Search User, Wallet, TX Hash, Ticket..." autocomplete="off"
                               style="width: 280px;">
                        <span class="mdi mdi-magnify search-widget-icon"></span>
                    </div>
                </form>

            </div>

            <!-- سمت راست: ترتیب دقیق قبلی شما -->
            <div class="d-flex align-items-center">


                <!-- Dark Mode -->
                <div class="ms-1 header-item d-none d-sm-flex">
                    <button type="button"
                            class="btn btn-icon btn-topbar btn-ghost-secondary rounded-circle light-dark-mode">
                        <i class='bx bx-moon fs-22'></i>
                    </button>
                </div>

                <!-- Notifications Dropdown -->
                <div class="dropdown topbar-head-dropdown ms-1 header-item">
                    <button type="button" class="btn btn-icon btn-topbar btn-ghost-secondary rounded-circle"
                            id="page-header-notifications-dropdown" data-bs-toggle="dropdown" aria-haspopup="true"
                            aria-expanded="false">
                        <i class='bx bx-bell fs-22'></i>

                        {% if admin_unread_notifications|length > 0 %}
                            <span class="position-absolute topbar-badge fs-10 translate-middle badge rounded-pill bg-danger">
                                {{ admin_unread_notifications|length }}
                                <span class="visually-hidden">unread messages</span>
                            </span>
                        {% endif %}
                    </button>

                    <div class="dropdown-menu dropdown-menu-lg dropdown-menu-end p-0 shadow-lg border-0"
                         aria-labelledby="page-header-notifications-dropdown">

                        <div class="dropdown-head bg-primary bg-pattern rounded-top p-3">
                            <div class="row align-items-center">
                                <div class="col">
                                    <h6 class="m-0 fs-15 fw-semibold text-white">Unread Notifications</h6>
                                </div>
                                <div class="col-auto">
                                    <span class="badge bg-light text-body fs-11">
                                        {{ admin_unread_notifications|length }} New
                                    </span>
                                </div>
                            </div>
                        </div>

                        <div class="py-2 ps-2">
                            <div data-simplebar style="max-height: 300px;" class="pe-2">
                                {% for n in admin_unread_notifications %}
                                    <div class="text-reset notification-item d-block dropdown-item position-relative active"
                                         data-id="{{ n.id }}">
                                        <div class="d-flex">
                                            <div class="avatar-xs me-3">
                                                <span class="avatar-title bg-soft-danger text-danger rounded-circle fs-16">
                                                    <i class="bx bx-bell"></i>
                                                </span>
                                            </div>
                                            <div class="flex-1">
                                                <a href="{{ n.link }}" class="stretched-link">
                                                    <h6 class="mt-0 mb-1 fs-13 fw-semibold">{{ n.title }}</h6>
                                                </a>
                                                <p class="mb-0 fs-11 fw-medium text-uppercase text-muted">
                                                    <span><i
                                                            class="mdi mdi-clock-outline"></i> {{ n.created_at|timesince }} ago</span>
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                {% empty %}
                                    <div class="text-center text-muted py-4">
                                        <i class="bx bx-bell-off fs-24 mb-2 d-block opacity-50"></i>
                                        <p class="mb-0 fs-13">No unread notifications</p>
                                    </div>
                                {% endfor %}
                            </div>
                        </div>

                        <div class="p-2 border-top border-top-dashed text-center">
                            <button type="button"
                                    class="btn btn-sm btn-soft-success w-100 fw-bold shadow-none"
                                    onclick="markAllNotificationsRead(this, 'admin')">
                                <i class="ri-check-double-line align-middle me-1"></i> Mark All as Read
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Profile Dropdown -->
                <div class="dropdown ms-sm-3 header-item topbar-user">
                    <button type="button" class="btn" id="page-header-user-dropdown" data-bs-toggle="dropdown"
                            aria-haspopup="true" aria-expanded="false">
                        <span class="d-flex align-items-center">
                            <img class="rounded-circle header-profile-user"
                                 src="
                                         {% if request.admin_user.is_senior %}{% static 'assets/images/users/photo_2025-09-25_03-16-49.jpg' %}{% else %}{% static 'assets/images/users/photo_2025-09-25_03-16-49.jpg' %}{% endif %}"
                                 alt="Header Avatar">
                            <span class="text-start ms-xl-2">
                                <span class="d-none d-xl-inline-block ms-1 fw-medium user-name-text">
                                    {{ request.admin_user.username|default:request.admin_user.email }}
                                </span>
                                <span class="d-none d-xl-block ms-1 fs-12 text-muted user-name-sub-text">
                                    {% if request.admin_user.is_senior %}Senior Admin{% else %}Admin{% endif %}
                                </span>
                            </span>
                        </span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end">
                        <h6 class="dropdown-header">Welcome!</h6>

                        <a class="dropdown-item" href="{% url 'admin_password' %}">
                            <i class="mdi mdi-cog-outline text-muted fs-16 align-middle me-1"></i>
                            <span class="align-middle">Security Settings</span>
                        </a>

                        <a class="dropdown-item" href="{% url 'user-ticket_list' %}">
                            <i class="mdi mdi-message-text-outline text-muted fs-16 align-middle me-1"></i>
                            <span class="align-middle">Support Messages</span>
                        </a>

                        <div class="dropdown-divider"></div>

                        <a class="dropdown-item" href="{% url 'admin-lock-screen' %}">
                            <i class="mdi mdi-lock text-muted fs-16 align-middle me-1"></i>
                            <span class="align-middle">Lock screen</span>
                        </a>

                        <a class="dropdown-item" href="{% url 'admin-logout' %}">
                            <i class="mdi mdi-logout text-muted fs-16 align-middle me-1"></i>
                            <span class="align-middle" data-key="t-logout">Logout</span>
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>
</header>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        if (!document.querySelector('.custom-sidebar-overlay')) {
            const overlay = document.createElement('div');
            overlay.className = 'custom-sidebar-overlay';
            Object.assign(overlay.style, {
                position: 'fixed',
                top: 0,
                left: 0,
                width: '100vw',
                height: '100vh',
                background: 'rgba(0,0,0,0.5)',
                zIndex: '1001',
                display: 'none'
            });
            document.body.appendChild(overlay);

            overlay.addEventListener('click', function () {
                document.body.classList.remove('vertical-sidebar-enable');
                overlay.style.display = 'none';
            });
        }

        const hamburger = document.getElementById('topnav-hamburger-icon');
        if (hamburger) {
            hamburger.addEventListener('click', function () {
                const overlay = document.querySelector('.custom-sidebar-overlay');
                setTimeout(() => {
                    if (document.body.classList.contains('vertical-sidebar-enable')) {
                        overlay.style.display = 'block';
                    } else {
                        overlay.style.display = 'none';
                    }
                }, 50);
            });
        }
    });
</script>

<script>
    function markAllNotificationsRead(btnElement, scopeType) {
        const originalContent = btnElement.innerHTML;
        btnElement.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
        btnElement.disabled = true;

        fetch("{% url 'dashboard:mark-all-notifications-read' %}", {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/json'
            },
            credentials: 'include',
            body: JSON.stringify({'scope': scopeType})
        })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    const sidebarIndicators = document.querySelectorAll('.sidebar-notif-indicator');
                    sidebarIndicators.forEach(el => {
                        el.style.display = 'none';
                    });

                    const topbarBadges = document.querySelectorAll('.topbar-badge');
                    topbarBadges.forEach(badge => {
                        badge.classList.add('d-none');
                    });

                    const dropdownCounts = document.querySelectorAll('.dropdown-head .badge');
                    dropdownCounts.forEach(s => {
                        s.innerText = '0 New';
                    });

                    document.querySelectorAll('.notification-item.active').forEach(item => {
                        item.classList.remove('active');
                    });

                    if (typeof Toastify !== "undefined") {
                        Toastify({
                            text: "All clear! Workspace synchronized.",
                            duration: 3000,
                            gravity: "top",
                            position: "right",
                            style: {background: "#2c3e50", borderRadius: "8px"}
                        }).showToast();
                    }
                }
            })
            .catch(error => console.error('Error:', error))
            .finally(() => {
                btnElement.innerHTML = originalContent;
                btnElement.disabled = false;
            });
    }
</script>
